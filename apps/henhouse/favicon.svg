      <stop offset="0%" stop-color="#2a0a00"/>
      <stop offset="60%" stop-color="#0d0000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5a1e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff2222" stop-opacity="0"/>
